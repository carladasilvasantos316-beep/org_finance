<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bancos – Organiza Finance</title>
    <meta name="description" content="Gerencie suas contas bancárias e acompanhe seus saldos." />
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>

    <!-- ── Navegação ── -->
    <nav class="navbar">
        <a href="../index.html" class="navbar-brand">
            <div class="brand-icon">💰</div>
            <span>Organiza Finance</span>
        </a>
        <ul class="navbar-nav">
            <li><a href="../index.html" class="nav-link">Dashboard</a></li>
            <li><a href="movimentacoes.html" class="nav-link">Movimentações</a></li>
            <li><a href="bancos.html" class="nav-link" id="nav-banks">Bancos</a></li>
            <li><a href="invest.html" class="nav-link" id="nav-invest">Invest</a></li>
            <li><a href="calendario.html" class="nav-link">Calendário</a></li>
            <li><a href="relatorio.html" class="nav-link">Relatório</a></li>
        </ul>
        <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
            <span id="theme-icon">🌙</span>
        </button>
    </nav>

    <main class="page-wrapper">

        <div class="page-header">
            <h1>Gerenciamento de Bancos</h1>
            <p>Cadastre suas contas e acompanhe os saldos individuais</p>
        </div>

        <div class="grid-main">
            <!-- Coluna: Cadastro de Banco -->
            <section>
                <div class="card">
                    <div class="card-title">Novo Banco / Conta</div>
                    <form id="form-banco-add">
                        <div class="form-group">
                            <label for="banco-nome">Nome da Instituição</label>
                            <input type="text" id="banco-nome" class="form-control" placeholder="Ex: Nubank, Itaú, Carteira..." required />
                        </div>
                        <div class="form-group">
                            <label for="banco-saldo">Saldo Inicial (R$)</label>
                            <input type="number" id="banco-saldo" class="form-control" step="0.01" value="0.00" />
                        </div>
                        <div class="form-group">
                            <label for="banco-cor">Cor de Identificação</label>
                            <input type="color" id="banco-cor" class="form-control" value="#3b82f6" style="height: 44px; padding: 2px;" />
                        </div>
                        <button type="submit" class="btn btn-primary">➕ Adicionar Banco</button>
                    </form>
                </div>
            </section>

            <!-- Coluna: Lista de Bancos -->
            <section style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="card">
                    <div class="card-title">Seus Bancos</div>
                    <div id="lista-bancos" class="bancos-grid">
                        <!-- Preenchido pelo JS -->
                    </div>
                </div>

                <!-- Novo: Detalhes das movimentações do banco -->
                <div id="banco-detalhes-container" class="card" style="display: none;">
                    <div class="card-title" id="banco-detalhes-titulo">Movimentações do Banco</div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Tipo</th>
                                    <th>Categoria</th>
                                    <th>Valor</th>
                                    <th>Descrição</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-banco-movimentos">
                                <!-- Preenchido pelo JS -->
                            </tbody>
                        </table>
                    </div>
                    <div style="margin-top: 1rem; text-align: right;">
                        <button class="btn btn-danger" onclick="document.getElementById('banco-detalhes-container').style.display='none'">Fechar Detalhes</button>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <script src="../js/script.js"></script>
    <script>
        // Ativa o link na navbar
        document.getElementById('nav-banks').classList.add('active');
    </script>
</body>

</html>
